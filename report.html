<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Report</title>
  <style>
    /* Global Styles */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .report-container {
      margin: 20px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);
      max-width: 800px;
    }

    .report-container h2 {
      color: #0a66c2;
      margin-bottom: 15px;
      text-align: center;
    }

    /* Buttons */
    .report-container button {
      margin: 5px;
      padding: 10px 20px;
      background-color: #0a66c2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .report-container button:hover {
      background-color: #004182;
    }

    .report-container button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table th, table td {
      border: 1px solid #ddd;
      padding: 10px 12px;
      text-align: left;
    }

    table th {
      background-color: #0a66c2;
      color: #ffffff;
      font-weight: 600;
    }

    table td {
      background-color: #fdfdfd;
      color: #333;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .modal-content {
      background-color: #ffffff;
      margin: 5% auto;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 900px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
    }

    .modal-content h3 {
      color: #0a66c2;
      margin-bottom: 15px;
      text-align: center;
    }

    .modal-content button {
      margin: 10px;
      padding: 10px 20px;
      background-color: #0a66c2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .modal-content button:hover {
      background-color: #004182;
    }

    .modal-content button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover,
    .close:focus {
      color: #000;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="report-container">
    <h2>Generate Reports</h2>
    <button id="dailyReportBtn">Daily Report</button>
    <button id="weeklyReportBtn">Weekly Report</button>
    <button id="monthlyReportBtn">Monthly Report</button>
  </div>

  <!-- The Modal -->
  <div id="reportModal" class="modal">
    <!-- Modal Content -->
    <div class="modal-content">
      <span class="close" onclick="closeModal()">×</span>
      <div id="reportOutput"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js';
    import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js';
    import { jsPDF } from 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCX0vxlyd0hXXDur4v3SpAnNuRwrm4Fyyc",
      authDomain: "gas-refill-app.firebaseapp.com",
      projectId: "gas-refill-app",
      storageBucket: "gas-refill-app.firebasestorage.app",
      messagingSenderId: "369760533545",
      appId: "1:369760533545:web:5bc99b940b30154fe3b038",
      measurementId: "G-8GV51M539Z"
    };

    // Initialize Firebase
    console.log("Initializing Firebase for report page...");
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    console.log("Firebase initialized successfully");

    let currentUser = null;

    // Listen for authentication state changes
    onAuthStateChanged(auth, (user) => {
      console.log("Auth state changed:", user ? `User ${user.uid} logged in` : "No user logged in");
      if (user) {
        currentUser = user;
        console.log('User logged in:', currentUser.email, 'UID:', currentUser.uid);
      } else {
        currentUser = null;
        console.log('No user logged in, redirecting to index.html');
        alert("Unauthorized access!");
        window.location.href = "index.html";
      }
    });

    // Helper function to get date range (UTC)
    function getDateRange(period) {
      const now = new Date();
      let startDate, endDate;

      if (period === 'daily') {
        startDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
        endDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 23, 59, 59));
      } else if (period === 'weekly') {
        const lastSunday = new Date(now);
        lastSunday.setUTCDate(now.getUTCDate() - now.getUTCDay());
        const nextSunday = new Date(lastSunday);
        nextSunday.setUTCDate(lastSunday.getUTCDate() + 7);
        startDate = new Date(Date.UTC(lastSunday.getUTCFullYear(), lastSunday.getUTCMonth(), lastSunday.getUTCDate()));
        endDate = new Date(Date.UTC(nextSunday.getUTCFullYear(), nextSunday.getUTCMonth(), nextSunday.getUTCDate(), 23, 59, 59));
      } else if (period === 'monthly') {
        startDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1));
        endDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0, 23, 59, 59));
      }

      console.log(`Date range for ${period}: ${startDate.toISOString()} to ${endDate.toISOString()}`);
      return { start: startDate, end: endDate };
    }

    // Function to generate report
    async function generateReport(period) {
      if (!currentUser) {
        console.log("No user logged in, cannot generate report");
        alert("Please log in first.");
        window.location.href = "index.html";
        return;
      }

      const buttons = [document.getElementById('dailyReportBtn'), document.getElementById('weeklyReportBtn'), document.getElementById('monthlyReportBtn')];
      buttons.forEach(btn => btn.disabled = true);

      const { start, end } = getDateRange(period);
      const ordersRef = collection(db, 'orders');
      const q = query(ordersRef, where("userId", "==", currentUser.uid));

      try {
        const querySnapshot = await getDocs(q);
        console.log("Query returned", querySnapshot.size, "orders for user:", currentUser.uid);
        const orders = [];
        querySnapshot.forEach((doc) => {
          const orderData = doc.data();
          console.log("Processing order:", doc.id, orderData);
          let orderDate;
          if (orderData.orderDate && typeof orderData.orderDate.toDate === 'function') {
            console.log("orderDate is a Timestamp for order:", doc.id);
            orderDate = orderData.orderDate.toDate();
          } else if (orderData.orderDate && typeof orderData.orderDate === 'string') {
            console.log("orderDate is a string for order:", doc.id, orderData.orderDate);
            orderDate = new Date(orderData.orderDate);
          } else {
            console.log("orderDate is invalid or missing for order:", doc.id);
            orderDate = new Date();
          }
          if (orderDate >= start && orderDate <= end) {
            orders.push({ id: doc.id, ...orderData, orderDate });
          }
        });
        console.log(`Filtered ${orders.length} orders within ${period} range`);
        displayReport(orders, period);
      } catch (error) {
        console.error('Error generating report:', error);
        alert('Failed to generate report: ' + error.message);
      } finally {
        buttons.forEach(btn => btn.disabled = false);
      }
    }

    // Function to display report inside modal
    function displayReport(orders, period) {
      const reportOutput = document.getElementById('reportOutput');
      const modal = document.getElementById('reportModal');
      
      if (!reportOutput || !modal) {
        console.error("Report output or modal not found");
        alert("Required UI elements are missing. Please check the page structure.");
        return;
      }

      if (orders.length === 0) {
        console.log(`No orders found for ${period} report`);
        reportOutput.innerHTML = `<p>No orders found for this ${period} period.</p>`;
      } else {
        console.log(`Displaying ${orders.length} orders for ${period} report`);
        reportOutput.innerHTML = ` 
          <h3>${period.charAt(0).toUpperCase() + period.slice(1)} Report</h3>
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Gas Type</th>
                <th>Quantity</th>
                <th>Order Date</th>
                <th>Delivery Address</th>
              </tr>
            </thead>
            <tbody>
              ${orders
                .map(
                  (order) => ` 
                <tr>
                  <td>${order.id.slice(0, 4)}...</td>
                  <td>${order.gasType || 'N/A'}</td>
                  <td>${order.quantity || 'N/A'}</td>
                  <td>${order.orderDate.toLocaleString()}</td>
                  <td>${order.deliveryAddress || 'N/A'}</td>
                </tr>`
                )
                .join('')}
            </tbody>
          </table>
          <button id="downloadReportButton">Download CSV</button>
          <button id="printReportButton">Print Report</button>
          <button id="downloadPdfButton">Download PDF</button>
        `;
        document.getElementById('downloadReportButton').addEventListener('click', () => {
          console.log(`Downloading ${period} report as CSV`);
          const downloadButton = document.getElementById('downloadReportButton');
          downloadButton.disabled = true;
          generateCSV(orders, period).finally(() => {
            downloadButton.disabled = false;
          });
        });
        document.getElementById('printReportButton').addEventListener('click', () => {
          console.log(`Printing ${period} report`);
          const printButton = document.getElementById('printReportButton');
          printButton.disabled = true;
          printReport().finally(() => {
            printButton.disabled = false;
          });
        });
        document.getElementById('downloadPdfButton').addEventListener('click', () => {
          console.log(`Downloading ${period} report as PDF`);
          const pdfButton = document.getElementById('downloadPdfButton');
          pdfButton.disabled = true;
          generatePDF(orders, period).finally(() => {
            pdfButton.disabled = false;
          });
        });
      }
      modal.style.display = "block";
    }

    // Generate CSV for Download
    function generateCSV(orders, period) {
      console.log(`Generating CSV for ${period} report`);
      const escapeCsvField = (field) => `"${String(field || '').replace(/"/g, '""')}"`;
      const sanitizeCsvField = (field) => {
        const str = escapeCsvField(field);
        return /^[=+@-]/.test(str) ? `'${str}` : str;
      };
      const csvContent = [
        "OrderID,GasType,Quantity,OrderDate,DeliveryAddress",
        ...orders.map((order) =>
          [
            sanitizeCsvField(order.id),
            sanitizeCsvField(order.gasType),
            sanitizeCsvField(order.quantity),
            sanitizeCsvField(order.orderDate.toLocaleString()),
            sanitizeCsvField(order.deliveryAddress),
          ].join(",")
        )
      ].join("\n");

      return new Promise((resolve, reject) => {
        try {
          // Try data URI for WebView compatibility
          const dataUri = `data:text/csv;charset=utf-8,${encodeURIComponent(csvContent)}`;
          const link = document.createElement("a");
          link.setAttribute("href", dataUri);
          link.setAttribute("download", `${period}_report.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          console.log("CSV download initiated via data URI");
          resolve();
        } catch (error) {
          console.error("Error generating CSV via data URI:", error);
          try {
            // Fallback to Blob API
            console.log("Falling back to Blob API for CSV download");
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const filename = `${period}_report.csv`;
            if (navigator.msSaveBlob) {
              navigator.msSaveBlob(blob, filename);
              console.log("CSV download initiated via msSaveBlob");
              resolve();
            } else {
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.setAttribute("href", url);
              link.setAttribute("download", filename);
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              URL.revokeObjectURL(url);
              console.log("CSV download initiated via Blob API");
              resolve();
            }
          } catch (blobError) {
            console.error("Error generating CSV via Blob API:", blobError);
            alert("Failed to download CSV. Please try again or contact support.");
            reject(blobError);
          }
        }
      });
    }

    // Generate PDF for Download
    function generatePDF(orders, period) {
      return new Promise((resolve) => {
        console.log(`Generating PDF for ${period} report`);
        const doc = new jsPDF();
        doc.text(`${period.charAt(0).toUpperCase() + period.slice(1)} Report`, 10, 10);
        doc.autoTable({
          head: [['Order ID', 'Gas Type', 'Quantity', 'Order Date', 'Delivery Address']],
          body: orders.map(order => [
            order.id.slice(0, 4) + '...',
            order.gasType || 'N/A',
            order.quantity || 'N/A',
            order.orderDate.toLocaleString(),
            order.deliveryAddress || 'N/A'
          ]),
          styles: { font: 'Helvetica', fontSize: 10 },
          headStyles: { fillColor: [10, 102, 194], textColor: [255, 255, 255] },
          alternateRowStyles: { fillColor: [253, 253, 253] }
        });
        doc.save(`${period}_report.pdf`);
        console.log("PDF download initiated");
        resolve();
      });
    }

    // Function to close the modal
    window.closeModal = function() {
      console.log("Closing report modal");
      const modal = document.getElementById('reportModal');
      modal.style.display = "none";
    }

    // Function to print the report
    window.printReport = function() {
      return new Promise((resolve, reject) => {
        console.log("Printing report");
        try {
          if (window.android && window.android.printReport) {
            console.log("Using native Android print");
            window.android.printReport(document.getElementById('reportOutput').innerHTML);
            resolve();
            return;
          }
          const printContents = document.getElementById('reportOutput').innerHTML;
          const printWindow = window.open('', '', 'width=800,height=600');
          if (!printWindow) {
            throw new Error("Failed to open print window");
          }
          printWindow.document.write(`
            <html>
            <head>
              <title>Print Report</title>
              <style>
                body {
                  font-family: 'Poppins', sans-serif;
                  color: #333;
                }
                h3 {
                  color: #0a66c2;
                  text-align: center;
                }
                table {
                  width: 100%;
                  border-collapse: collapse;
                  margin-top: 20px;
                }
                th, td {
                  border: 1px solid #ddd;
                  padding: 10px;
                  text-align: left;
                }
                th {
                  background-color: #0a66c2;
                  color: white;
                  font-weight: 600;
                }
                td {
                  background-color: #fdfdfd;
                }
              </style>
            </head>
            <body>${printContents}</body>
            </html>
          `);
          printWindow.document.close();
          printWindow.print();
          printWindow.close();
          resolve();
        } catch (error) {
          console.error("Error printing report:", error);
          alert("Failed to print report. Try downloading the report as a PDF instead.");
          reject(error);
        }
      });
    };

    // Event listeners for the report buttons
    document.addEventListener('DOMContentLoaded', function() {
      const dailyBtn = document.getElementById('dailyReportBtn');
      const weeklyBtn = document.getElementById('weeklyReportBtn');
      const monthlyBtn = document.getElementById('monthlyReportBtn');
      if (!dailyBtn || !weeklyBtn || !monthlyBtn) {
        console.error("Report buttons not found");
        alert("Required UI elements are missing. Please check the page structure.");
        return;
      }
      dailyBtn.addEventListener('click', () => {
        console.log("Daily report button clicked");
        generateReport('daily');
      });
      weeklyBtn.addEventListener('click', () => {
        console.log("Weekly report button clicked");
        generateReport('weekly');
      });
      monthlyBtn.addEventListener('click', () => {
        console.log("Monthly report button clicked");
        generateReport('monthly');
      });
    });
</script>
</body>
</html>

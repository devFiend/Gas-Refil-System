<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <script type="module" src="excess.js" defer></script>
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <div class="container">
    <h1 id="profileName">User Profile</h1>
    
    <!-- Logout Button -->
    <button id="logoutButton">Logout</button>
    
    <!-- Profile Management Button -->
    <button id="editProfileButton">Edit Profile</button>

    <!-- Profile Management Modal -->
    <div id="profileModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" id="closeModalButton">×</span>
        <h2>Update Profile</h2>
        <form id="profileForm">
          <label for="displayName">Display Name</label>
          <input type="text" id="displayName" placeholder="Enter your display name" required />
          
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="Enter new password" />
          
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm new password" />
          
          <button type="submit" id="update-profile-btn">Save Changes</button>
        </form>
      </div>
    </div>

    <!-- Place Order Button -->
    <button id="placeOrderButton">Place an Order</button>

    <!-- Order Form Modal -->
    <div id="orderModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" id="closeOrderModalButton">×</span>
        <h1>Place Your Order</h1>
        <form id="orderForm">
          <label for="gasType">Gas Type:</label>
          <select id="gasType" required>
            <option value="LPG" data-price="1500">LPG (₦1500/kg)</option>
            <option value="CNG" data-price="250">CNG (₦250/kg)</option>
          </select>
          <br>
  
          <label for="quantity">Quantity (kg):</label>
          <input type="number" id="quantity" min="1" step="1" required>
          <p id="priceTag">Total Price: ₦0</p>
          <br>
  
          <label for="deliveryAddress">Delivery Address:</label>
          <input type="text" id="deliveryAddress" required>
          <br>
  
          <button type="button" id="showBankDetailsButton">Proceed to Payment</button>
        </form>
      </div>
    </div>
  
    <!-- Bank Details Modal -->
    <div id="bankModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" id="closeBankModalButton">×</span>
        <h1>Bank Details</h1>
        <p id="bankDetails"></p>
        <p id="orderPrice"></p>
        <button id="proceedPaymentButton">Proceed</button>
        <button id="cancelPaymentButton">Cancel</button>
      </div>
    </div>

    <!-- Order History Button -->
    <button id="viewOrderHistoryButton">View Order History</button>

    <!-- Order History Modal -->
    <div id="orderHistoryModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" id="closeOrderHistoryModalButton">×</span>
        <h2>Order History</h2>
        <table id="orderHistoryTable">
          <thead>
            <tr>
              <th>Gas Type</th>
              <th>Order Date</th>
              <th>Quantity</th>
              <th>Total Price</th>
              <th>Delivery Address</th>
              <th>Bank Details</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>          
      </div>
    </div>  
    
    <button onclick="location.href='report.html'">View Reports</button>

    <!-- Rating Section -->
    <section id="ratingSection">
      <h2>Rate Your Experience</h2>
      <div class="rating">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>
      <button id="submitRatingButton">Submit Rating</button>
    </section>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Records - Transaction History</title>
  <style>
    /* Global Styles */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .container {
      margin: 20px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);
      max-width: 1000px;
    }

    h1 {
      color: #0a66c2;
      margin-bottom: 15px;
      text-align: center;
    }

    /* Buttons */
    button {
      margin: 10px;
      padding: 10px 20px;
      background-color: #0a66c2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #004182;
    }

    #logoutButton {
      background-color: #e60023;
    }

    #logoutButton:hover {
      background-color: #b8001b;
    }

    #downloadCsvButton {
      background-color: #006097;
    }

    #downloadCsvButton:hover {
      background-color: #004a7c;
    }

    /* Table Styles */
    .table-container {
      margin-top: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background-color: #0a66c2;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
    }

    td {
      background-color: #fdfdfd;
      color: #333;
      font-size: 14px;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #eef6fb;
    }

    td.order-id {
      cursor: pointer;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 20px;
      }

      button {
        font-size: 12px;
        padding: 8px 10px;
      }

      th, td {
        font-size: 12px;
      }

      .container {
        padding: 15px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 18px;
      }

      button {
        font-size: 10px;
        padding: 6px 8px;
      }

      th, td {
        font-size: 10px;
      }

      .container {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Payment Records - Transaction History</h1>
    <button id="backButton">Back to Admin Dashboard</button>
    <button id="logoutButton">Logout</button>
    <button id="downloadCsvButton">Download CSV</button>
    <div class="table-container">
      <table border="1">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>User ID</th>
            <th>Total Price</th>
            <th>Bank Details</th>
            <th>Order Date</th>
          </tr>
        </thead>
        <tbody id="paymentRecordsTable"></tbody>
      </table>
    </div>
  </div>

  <script src="payment-record.js" type="module"></script>
</body>
</html>
